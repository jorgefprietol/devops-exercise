name: Integración y despliegue DevOps
on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno de despliegue
        type: choice
        options: [development, staging, production]
        default: staging
      version:
        description: 'Etiqueta vX.Y.Z existente; vacío utiliza la rama seleccionada'
        type: string
        default: ''
env:
  DOTNET_CLI_UI_LANGUAGE: es
  DOCKER_BUILD_SUMMARY: 'false'
permissions:
  contents: read
jobs:
  build:
    name: Compilación
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      target: ${{ steps.meta.outputs.target }}
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0
      - name: Seleccionar versión y entorno
        id: meta
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REQUESTED_ENV: ${{ inputs.environment }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ -n "$VERSION" && ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          target=staging
          if [[ "$REF" == refs/heads/develop ]]; then target=development; fi
          if [[ "$EVENT" == workflow_dispatch ]]; then target="$REQUESTED_ENV"; fi
          if [[ "$REF" == refs/heads/master ]]; then target=production; fi
          if [[ "$target" == production && "$EVENT" != pull_request ]]; then
            git merge-base --is-ancestor HEAD origin/master
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - name: Preparar SDK de .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restaurar dependencias bloqueadas
        run: dotnet restore --locked-mode
      - name: Auditar dependencias directas y transitivas
        run: python3 scripts/dependency_audit.py
      - name: Compilar con análisis estático
        run: dotnet build -c Release --no-restore -warnaserror
      - name: Verificar formato del código
        run: dotnet format --verify-no-changes --no-restore
  test:
    name: Pruebas
    needs: build
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: jorge-devops-exercise
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
      - name: Preparar SDK de .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Restaurar dependencias bloqueadas
        run: dotnet restore --locked-mode
      - name: Ejecutar pruebas automatizadas
        run: dotnet test -c Release --no-restore --collect:'XPlat Code Coverage' --logger trx --results-directory evidence/green
      - name: Conservar auditoría de dependencias
        run: python3 scripts/dependency_audit.py
      - name: Probar el control de seguridad de dependencias
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verificar el umbral de cobertura
        run: python3 scripts/coverage_gate.py 80
      - name: Probar el arranque del evaluador y la integración HTTPS
        run: python3 scripts/demo.py
      - name: Consultar registros en caso de error
        if: failure()
        run: docker compose logs --tail=60
      - name: Detener contenedores de prueba
        if: always()
        run: docker compose down
      - name: Guardar resultados de pruebas
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pruebas-y-cobertura
          path: evidence/green
  package:
    name: Imagen Docker
    needs: [build, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
      - name: Preparar constructor Docker
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Autenticar el registro de imágenes
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preparar nombre de imagen
        id: name
        env:
          REPO: ${{ github.repository }}
        run: echo "value=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"
      - name: Construir y publicar imagen
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.value }}:sha-${{ needs.build.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.build.outputs.sha }}
      - name: Registrar imagen inmutable
        id: image
        env:
          NAME: ${{ steps.name.outputs.value }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "ref=$NAME@$DIGEST" >> "$GITHUB_OUTPUT"
  deploy:
    name: Despliegue Kubernetes
    needs: [build, test, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-${{ needs.build.outputs.target }}
      cancel-in-progress: false
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
      - name: Solicitar despliegue y esperar la verificación pública
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENV: ${{ needs.build.outputs.target }}
          DEPLOY_SHA: ${{ needs.build.outputs.sha }}
          IMAGE: ${{ needs.package.outputs.image }}
        run: python3 scripts/request_deployment.py
